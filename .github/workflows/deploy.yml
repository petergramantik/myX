name: Nasadit web
# Push do main (nebo spuštění z dev větve): testy, sestavení a nasazení na GitHub Pages.
# Produkce z větve main → …/myX/, dev verze z větve dev → …/myX/dev/ (když větev dev existuje).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      attempt:
        description: "Pokus (opakování po chybě GitHubu)"
        required: false
        default: "1"
permissions:
  actions: write
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Produkce (main) – testy a sestavení
        run: |
          bun install
          bun tests/core.test.ts
          ./build.sh site
      - name: Dev (větev dev) – testy a sestavení do site/dev
        run: |
          if git ls-remote --exit-code --heads origin dev >/dev/null; then
            git worktree add ../devsrc origin/dev
            cd ../devsrc
            bun install
            bun tests/core.test.ts
            ./build.sh "$GITHUB_WORKSPACE/site/dev"
          else
            echo "Větev dev neexistuje – nasazuji jen produkci."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Zveřejnění občas selže na straně GitHubu („No artifacts named github-pages“) – zkusit znovu po pauze.
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d1.outcome == 'failure'
        run: sleep 60
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d2.outcome == 'failure'
        run: sleep 90
      - id: d3
        if: steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Ani tak – spustit celé nasazení znovu (nové sestavení a nový artefakt), nejvýš 3 běhy.
      - name: Opakovat celé nasazení
        if: steps.d3.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
        run: |
          if [ "$ATTEMPT" -lt 3 ]; then
            sleep 60
            gh workflow run "Nasadit web" --repo "$GITHUB_REPOSITORY" --ref main -f attempt=$((ATTEMPT + 1))
            echo "Nasazení selhalo, spuštěn pokus $((ATTEMPT + 1))."
          else
            echo "Nasazení selhalo ani na třetí pokus."
          fi
          exit 1
