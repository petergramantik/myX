<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<rect width="1024" height="1024" fill="#06172b"/>
<g transform="translate(102.4 102.4) scale(.8)">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#102844"/>
    <stop offset="0.52" stop-color="#071a31"/>
    <stop offset="1" stop-color="#031225"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="45%" r="70%">
    <stop offset="0" stop-color="#0b3a62" stop-opacity=".48"/>
    <stop offset="1" stop-color="#001326" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#20d9f5"/>
    <stop offset="1" stop-color="#078bd5"/>
  </linearGradient>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="16" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="1024" height="1024" rx="210" fill="url(#bg)"/>
<rect width="1024" height="1024" rx="210" fill="url(#glow)"/>
<rect x="3" y="3" width="1018" height="1018" rx="207" fill="none" stroke="#087fbd" stroke-opacity=".55" stroke-width="6"/>
<g font-family="DejaVu Sans, Arial, sans-serif" font-weight="800">
  <text x="315" y="630" text-anchor="middle" font-size="246" letter-spacing="-15" fill="#f7f9fc">MY</text>
  <text x="690" y="675" text-anchor="middle" font-size="470" letter-spacing="-28" fill="url(#cyan)">X</text>
</g>
<text x="512" y="805" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif"
      font-size="76" font-weight="500" letter-spacing="25" fill="#f4f7fb">LOGBOOK</text>
</g></svg>